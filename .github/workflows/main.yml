name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. إنشاء مشروع جديد نظيف تماماً بملفات أندرويد جاهزة
      - name: Create Clean Flutter Project
        run: |
          cd ..
          flutter create --project-name=quran_app fresh_app

      # 2. نقل ملفات الكود والـ pubspec الخاصة بك إلى المشروع النظيف
      - name: Copy Custom Code & Assets
        run: |
          cp -r lib/main.dart ../fresh_app/lib/main.dart 2>/dev/null || true
          cp pubspec.yaml ../fresh_app/pubspec.yaml 2>/dev/null || true
          cp -r assets ../fresh_app/ 2>/dev/null || true

      # 3. إشعار التبعيات وبناء الـ APK
      - name: Build APK Cleanly
        run: |
          cd ../fresh_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      # 4. رفع الـ APK الناتج
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-release-apk
          path: ../fresh_app/build/app/outputs/flutter-apk/app-release.apk
          
